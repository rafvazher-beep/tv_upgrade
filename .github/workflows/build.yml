name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar tipografia Outfit (licencia OFL)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/Outfit.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/outfit/Outfit%5Bwght%5D.ttf' || echo "Fuente no descargada: se usara la del sistema"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
